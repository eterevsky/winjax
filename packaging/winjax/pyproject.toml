[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "winjax"
version = "0.11.0"
description = "Native Windows CUDA support for JAX (unofficial PJRT plugin loader)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13,<3.15"
authors = [{ name = "Oleg Eterevsky", email = "oleg@eterevsky.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: GPU :: NVIDIA CUDA :: 13",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "jax==0.11.0",
    "jaxlib==0.11.0",
    "winjax-cuda13-pjrt==0.11.0.*",
    "winjax-cuda13-plugin==0.11.0.*",
    # NVIDIA CUDA 13 runtime wheels (unsuffixed cu13 distribution names).
    # Upper bounds keep pip away from future major versions that may not
    # ship win_amd64 wheels.
    "nvidia-cublas>=13.0.0.19,<14",
    "nvidia-cuda-cupti>=13.3.75,<14",
    "nvidia-cuda-nvcc>=13.0.48,<14",
    "nvidia-cuda-nvrtc>=13.0.48,<14",
    "nvidia-cuda-runtime>=13.0.48,<14",
    "nvidia-cudnn-cu13>=9.24.0.43,<10",
    "nvidia-cufft>=12.0.0.15,<13",
    "nvidia-cusolver>=12.0.3.29,<13",
    "nvidia-cusparse>=12.6.2.49,<13",
    "nvidia-nvjitlink>=13.0.39,<14",
    "nvidia-nvvm>=13,<14",
]

[project.urls]
Homepage = "https://github.com/eterevsky/winjax"

[tool.setuptools.packages.find]
include = ["jax_plugins*"]
namespaces = true
